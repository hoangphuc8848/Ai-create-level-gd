
name: Build AI Create Level

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: AI-Create-Level
          path: "**/*.geode"
          if-no-files-found: warn
          
